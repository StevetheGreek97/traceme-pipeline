name: Publish to PyPI

# Tests, builds and uploads traceme-pipeline to PyPI.
#
#   * Push a tag like v0.6.0 (matching `version` in pyproject.toml): runs the
#     tests, builds the sdist and wheel, checks them, and publishes to PyPI.
#   * Actions tab > "Publish to PyPI" > Run workflow: the same tests, build
#     and checks, without publishing. Use it to try a release first.
#
# Publishing uses PyPI trusted publishing (no API token). One-time setup:
#   1. On PyPI: project traceme-pipeline > Settings > Publishing > add a
#      GitHub publisher: owner StevetheGreek97, repository traceme-pipeline,
#      workflow publish.yml, environment pypi. (For a project not yet on
#      PyPI, add it as a "pending publisher" under your account instead.)
#   2. On GitHub: Settings > Environments > New environment "pypi"
#      (optionally require a reviewer, so each upload waits for approval).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check the distributions
        run: twine check --strict dist/*

      # The wheel installs and imports on its own (dependencies skipped: the
      # tests above already ran against them).
      - name: Install the wheel
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-check/bin/python -c "import traceme, traceme.prompts.parser, traceme.video.chunker; print('import ok')"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/traceme-pipeline/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
