[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceme-pipeline"
version = "0.6.0"
description = "TraceME video tracking pipeline using SAM2"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "imageio-ffmpeg>=0.4.9",
  "sam2>=1.1.0",
]

[project.optional-dependencies]
sam3 = ["sam3>=0.1.4"]  # requires Python >= 3.12

[project.scripts]
traceme-gen-tasks = "traceme.tools.gen_tasks:main"
traceme = "traceme.cli:main"
traceme-download-checkpoints = "traceme.tools.download_sam2:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests needing real model weights"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["traceme*"]
